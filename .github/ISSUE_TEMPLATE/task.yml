name: Project task
description: Define an implementation, design or documentation task.
title: "[Task] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable completion conditions and related requirement/test IDs.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner and dependencies
  - type: textarea
    id: validation
    attributes:
      label: Planned validation and evidence
